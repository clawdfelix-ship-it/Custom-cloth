<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>後台管理系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-900">
  <div class="mx-auto w-full max-w-7xl px-4 py-8">
    <div class="flex flex-wrap items-start justify-between gap-4">
      <div>
        <h1 class="text-2xl font-semibold tracking-tight">後台管理系統</h1>
        <p class="mt-1 text-sm text-slate-600">帳密登入（admin/factory）、訂單、款式、尺碼表、帳號、異常反饋。</p>
      </div>
      <div class="flex items-center gap-2">
        <a href="/" class="rounded-lg border bg-white px-3 py-2 text-sm hover:bg-slate-50">客戶端</a>
        <button id="logoutBtn" class="hidden rounded-lg border bg-white px-3 py-2 text-sm hover:bg-slate-50">登出</button>
      </div>
    </div>

    <section id="loginSection" class="mt-6 rounded-xl border bg-white p-5 shadow-sm">
      <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
        <div>
          <label class="text-sm font-medium">帳號</label>
          <input id="accInput" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" placeholder="例如：admin" />
        </div>
        <div>
          <label class="text-sm font-medium">密碼</label>
          <input id="pwdInput" type="password" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" placeholder="例如：123456" />
        </div>
        <div class="flex items-end">
          <button id="loginBtn" class="w-full rounded-lg bg-slate-900 px-3 py-2 text-sm font-semibold text-white hover:bg-slate-800">登入</button>
        </div>
      </div>
      <div id="loginMsg" class="mt-3 text-sm font-medium"></div>
      <div class="mt-2 text-xs text-slate-600">預設 seed：admin / 123456；factory1 / 123456（需先跑 db/schema.sql + db/seed.sql）</div>
    </section>

    <section id="appSection" class="mt-6 hidden rounded-xl border bg-white p-5 shadow-sm">
      <div class="flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap gap-2">
          <button data-tab="orders" class="tabBtn rounded-lg bg-slate-900 px-3 py-2 text-sm font-semibold text-white">訂單</button>
          <button data-tab="styles" class="tabBtn rounded-lg border bg-white px-3 py-2 text-sm hover:bg-slate-50">款式庫</button>
          <button data-tab="sizes" class="tabBtn rounded-lg border bg-white px-3 py-2 text-sm hover:bg-slate-50">尺碼表庫</button>
          <button data-tab="users" class="tabBtn rounded-lg border bg-white px-3 py-2 text-sm hover:bg-slate-50">帳號</button>
          <button data-tab="feedback" class="tabBtn rounded-lg border bg-white px-3 py-2 text-sm hover:bg-slate-50">異常反饋</button>
          <button data-tab="factory" class="tabBtn rounded-lg border bg-white px-3 py-2 text-sm hover:bg-slate-50">工廠端</button>
        </div>
        <div id="whoami" class="text-sm text-slate-600"></div>
      </div>

      <div id="appMsg" class="mt-3 text-sm font-medium"></div>

      <div id="tab-orders" class="mt-5">
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-6">
          <div class="sm:col-span-2">
            <label class="text-sm font-medium">訂單編號</label>
            <input id="fOrderSn" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" />
          </div>
          <div class="sm:col-span-2">
            <label class="text-sm font-medium">公司</label>
            <input id="fCompany" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="text-sm font-medium">電話</label>
            <input id="fPhone" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="text-sm font-medium">狀態</label>
            <select id="fStatus" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm">
              <option value="">全部</option>
              <option value="客戶已提交">客戶已提交</option>
              <option value="待確認報價">待確認報價</option>
              <option value="待確認樣板">待確認樣板</option>
              <option value="生產中">生產中</option>
              <option value="已出貨">已出貨</option>
              <option value="已完成">已完成</option>
              <option value="已取消">已取消</option>
            </select>
          </div>
          <div class="sm:col-span-2">
            <button id="loadOrdersBtn" class="mt-6 w-full rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-700">載入訂單</button>
          </div>
        </div>

        <div class="mt-4 overflow-x-auto">
          <table class="w-full min-w-[1200px] text-sm">
            <thead>
              <tr class="border-b bg-slate-50 text-left">
                <th class="px-3 py-2 font-medium">時間</th>
                <th class="px-3 py-2 font-medium">訂單編號</th>
                <th class="px-3 py-2 font-medium">類型</th>
                <th class="px-3 py-2 font-medium">狀態</th>
                <th class="px-3 py-2 font-medium">公司</th>
                <th class="px-3 py-2 font-medium">電話</th>
                <th class="px-3 py-2 font-medium">分類</th>
                <th class="px-3 py-2 font-medium">建議交貨日</th>
                <th class="px-3 py-2 font-medium">客戶交貨日</th>
                <th class="px-3 py-2 font-medium">工廠</th>
                <th class="px-3 py-2 text-right font-medium">操作</th>
              </tr>
            </thead>
            <tbody id="ordersBody"></tbody>
          </table>
        </div>
      </div>

      <div id="tab-styles" class="mt-5 hidden">
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-6">
          <div>
            <label class="text-sm font-medium">款式編號</label>
            <input id="styleCode" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" />
          </div>
          <div class="sm:col-span-2">
            <label class="text-sm font-medium">款式名稱</label>
            <input id="styleName" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="text-sm font-medium">大類</label>
            <input id="styleCate1" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" placeholder="現貨款式加工" />
          </div>
          <div>
            <label class="text-sm font-medium">子類</label>
            <input id="styleCate2" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" placeholder="球衣" />
          </div>
          <div>
            <label class="text-sm font-medium">尺碼表</label>
            <select id="styleSizeTableId" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm"></select>
          </div>
          <div class="sm:col-span-3">
            <label class="text-sm font-medium">圖片（<500KB）</label>
            <input id="styleImage" type="file" accept="image/*" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" />
          </div>
          <div class="sm:col-span-3">
            <label class="text-sm font-medium">備註</label>
            <input id="styleRemark" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" />
          </div>
          <div class="sm:col-span-2">
            <button id="createStyleBtn" class="mt-6 w-full rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-700">新增款式</button>
          </div>
          <div class="sm:col-span-2">
            <button id="loadStylesBtn" class="mt-6 w-full rounded-lg border bg-white px-3 py-2 text-sm hover:bg-slate-50">載入款式</button>
          </div>
        </div>
        <div class="mt-4 overflow-x-auto">
          <table class="w-full min-w-[900px] text-sm">
            <thead>
              <tr class="border-b bg-slate-50 text-left">
                <th class="px-3 py-2 font-medium">編號</th>
                <th class="px-3 py-2 font-medium">名稱</th>
                <th class="px-3 py-2 font-medium">分類</th>
                <th class="px-3 py-2 font-medium">尺碼表</th>
                <th class="px-3 py-2 text-right font-medium">操作</th>
              </tr>
            </thead>
            <tbody id="stylesBody"></tbody>
          </table>
        </div>
      </div>

      <div id="tab-sizes" class="mt-5 hidden">
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-6">
          <div class="sm:col-span-2">
            <label class="text-sm font-medium">尺碼表名稱</label>
            <input id="sizeName" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" />
          </div>
          <div class="sm:col-span-4">
            <label class="text-sm font-medium">輸入方式</label>
            <div class="mt-2 flex items-center gap-4 text-sm">
              <label class="inline-flex items-center gap-2">
                <input id="sizeModePaste" type="radio" name="sizeInputMode" value="paste" checked />
                貼表格（推薦）
              </label>
              <label class="inline-flex items-center gap-2">
                <input id="sizeModeJson" type="radio" name="sizeInputMode" value="json" />
                JSON（進階）
              </label>
            </div>
          </div>

          <div id="sizePasteWrap" class="sm:col-span-4">
            <label class="text-sm font-medium">貼表格內容（支援 Excel/Sheets copy）</label>
            <textarea id="sizePaste" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" rows="5" placeholder="直接貼入表格內容（通常係 TSV / CSV）"></textarea>
            <div class="mt-2 flex flex-wrap items-center gap-3 text-sm">
              <label class="inline-flex items-center gap-2">
                <input id="sizePasteHasHeader" type="checkbox" checked />
                第一行係表頭
              </label>
              <button id="previewSizeBtn" class="rounded-lg border bg-white px-3 py-2 text-sm hover:bg-slate-50" type="button">預覽</button>
              <button id="pasteExampleBtn" class="rounded-lg border bg-white px-3 py-2 text-sm hover:bg-slate-50" type="button">貼入範例</button>
              <div id="sizePasteMsg" class="text-slate-600"></div>
            </div>
            <div id="sizePastePreview" class="mt-2 overflow-x-auto rounded-lg border bg-white p-3 text-sm"></div>
          </div>

          <div id="sizeJsonWrap" class="sm:col-span-4 hidden">
            <label class="text-sm font-medium">尺碼表 JSON（array，每行：eu/chest/waist/length/china/height）</label>
            <textarea id="sizeData" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" rows="5"></textarea>
          </div>
          <div class="sm:col-span-2">
            <button id="createSizeBtn" class="w-full rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-700">新增尺碼表</button>
          </div>
          <div class="sm:col-span-2">
            <button id="loadSizesBtn" class="w-full rounded-lg border bg-white px-3 py-2 text-sm hover:bg-slate-50">載入尺碼表</button>
          </div>
        </div>
        <div class="mt-4 overflow-x-auto">
          <table class="w-full min-w-[900px] text-sm">
            <thead>
              <tr class="border-b bg-slate-50 text-left">
                <th class="px-3 py-2 font-medium">名稱</th>
                <th class="px-3 py-2 font-medium">ID</th>
                <th class="px-3 py-2 text-right font-medium">操作</th>
              </tr>
            </thead>
            <tbody id="sizesBody"></tbody>
          </table>
        </div>
      </div>

      <div id="tab-users" class="mt-5 hidden">
        <div class="grid grid-cols-1 gap-3 sm:grid-cols-6">
          <div>
            <label class="text-sm font-medium">帳號</label>
            <input id="userAcc" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="text-sm font-medium">密碼</label>
            <input id="userPwd" type="password" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" />
          </div>
          <div>
            <label class="text-sm font-medium">角色</label>
            <select id="userRole" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm">
              <option value="factory">factory</option>
              <option value="admin">admin</option>
            </select>
          </div>
          <div class="sm:col-span-2">
            <label class="text-sm font-medium">顯示名/工廠名</label>
            <input id="userName" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" />
          </div>
          <div class="sm:col-span-2">
            <button id="createUserBtn" class="mt-6 w-full rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-700">新增帳號</button>
          </div>
          <div class="sm:col-span-2">
            <button id="loadUsersBtn" class="mt-6 w-full rounded-lg border bg-white px-3 py-2 text-sm hover:bg-slate-50">載入帳號</button>
          </div>
        </div>
        <div class="mt-4 overflow-x-auto">
          <table class="w-full min-w-[900px] text-sm">
            <thead>
              <tr class="border-b bg-slate-50 text-left">
                <th class="px-3 py-2 font-medium">帳號</th>
                <th class="px-3 py-2 font-medium">角色</th>
                <th class="px-3 py-2 font-medium">名稱</th>
                <th class="px-3 py-2 text-right font-medium">操作</th>
              </tr>
            </thead>
            <tbody id="usersBody"></tbody>
          </table>
        </div>
      </div>

      <div id="tab-feedback" class="mt-5 hidden">
        <div class="flex items-center gap-2">
          <button id="loadFeedbackBtn" class="rounded-lg border bg-white px-3 py-2 text-sm hover:bg-slate-50">載入反饋</button>
        </div>
        <div class="mt-4 overflow-x-auto">
          <table class="w-full min-w-[900px] text-sm">
            <thead>
              <tr class="border-b bg-slate-50 text-left">
                <th class="px-3 py-2 font-medium">時間</th>
                <th class="px-3 py-2 font-medium">訂單</th>
                <th class="px-3 py-2 font-medium">工廠</th>
                <th class="px-3 py-2 font-medium">內容</th>
                <th class="px-3 py-2 font-medium">狀態</th>
                <th class="px-3 py-2 text-right font-medium">操作</th>
              </tr>
            </thead>
            <tbody id="feedbackBody"></tbody>
          </table>
        </div>
      </div>

      <div id="tab-factory" class="mt-5 hidden">
        <div class="flex items-center gap-2">
          <button id="loadFactoryOrdersBtn" class="rounded-lg border bg-white px-3 py-2 text-sm hover:bg-slate-50">載入工廠訂單</button>
        </div>
        <div class="mt-4 overflow-x-auto">
          <table class="w-full min-w-[900px] text-sm">
            <thead>
              <tr class="border-b bg-slate-50 text-left">
                <th class="px-3 py-2 font-medium">時間</th>
                <th class="px-3 py-2 font-medium">訂單</th>
                <th class="px-3 py-2 font-medium">公司</th>
                <th class="px-3 py-2 font-medium">狀態</th>
                <th class="px-3 py-2 text-right font-medium">操作</th>
              </tr>
            </thead>
            <tbody id="factoryBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </div>

  <div id="copyModal" class="fixed inset-0 hidden items-center justify-center bg-black/40 p-4">
    <div class="w-full max-w-lg rounded-2xl bg-white shadow-xl">
      <div class="flex items-center justify-between border-b px-5 py-4">
        <div class="text-base font-semibold">翻單（複製並建立新訂單）</div>
        <button id="closeCopyModal" class="rounded-lg border bg-white px-3 py-2 text-sm hover:bg-slate-50">關閉</button>
      </div>
      <div class="px-5 py-4 space-y-3">
        <div class="text-sm text-slate-600" id="copyInfo"></div>
        <div>
          <label class="text-sm font-medium">交貨日</label>
          <input id="copyDeliveryDate" type="date" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm" />

        <div id="copyMsg" class="text-sm font-medium"></div>
      </div>
      <div class="flex items-center justify-end gap-2 border-t px-5 py-4">

    <div id="factoryModal" class="fixed inset-0 hidden items-center justify-center bg-black/40 p-4">

          <div class="text-base font-semibold">工廠訂單操作</div>

            <div>

              <select id="factoryStatusSel" class="mt-1 w-full rounded-lg border px-3 py-2 text-sm">

                <option value="待確認報價">待確認報價</option>
                <option value="待確認樣板">待確認樣板</option>
                <option value="生產中">生產中</option>
                <option value="已出貨">已出貨</option>
                <option value="已完成">已完成</option>

              </select>
            </div>

              <button id="factoryUpdateStatusBtn" class="w-full rounded-lg bg-indigo-600 px-3 py-2 text-sm font-semibold text-white hover:bg-indigo-700">更新狀態</button>

            <label class="text-sm font-medium">附件（最多 3 張，每張 < 500KB）</label>

            <button id="factorySendFeedbackBtn" class="rounded-lg bg-emerald-600 px-3 py-2 text-sm font-semibold text-white hover:bg-emerald-700">提交反饋</button>
            <div id="factoryModalMsg" class="text-sm text-slate-600"></div>
          </div>

      </div>
    </div>

  <script>
    const loginSection = document.getElementById('loginSection');
    const appSection = document.getElementById('appSection');
    const loginMsg = document.getElementById('loginMsg');
    const appMsg = document.getElementById('appMsg');
    const whoami = document.getElementById('whoami');
    const logoutBtn = document.getElementById('logoutBtn');

    const accInput = document.getElementById('accInput');
    const pwdInput = document.getElementById('pwdInput');
    const loginBtn = document.getElementById('loginBtn');

    const tabButtons = Array.from(document.querySelectorAll('.tabBtn'));
    const tabIds = ['orders', 'styles', 'sizes', 'users', 'feedback', 'factory'];

    const fOrderSn = document.getElementById('fOrderSn');
    const fCompany = document.getElementById('fCompany');
    const fPhone = document.getElementById('fPhone');
    const fStatus = document.getElementById('fStatus');
    const loadOrdersBtn = document.getElementById('loadOrdersBtn');
    const ordersBody = document.getElementById('ordersBody');

    const styleSizeTableId = document.getElementById('styleSizeTableId');
    const loadStylesBtn = document.getElementById('loadStylesBtn');
    const createStyleBtn = document.getElementById('createStyleBtn');
    const stylesBody = document.getElementById('stylesBody');

    const loadSizesBtn = document.getElementById('loadSizesBtn');
    const createSizeBtn = document.getElementById('createSizeBtn');
    const sizeModePaste = document.getElementById('sizeModePaste');
    const sizeModeJson = document.getElementById('sizeModeJson');
    const sizePasteWrap = document.getElementById('sizePasteWrap');
    const sizeJsonWrap = document.getElementById('sizeJsonWrap');
    const sizePaste = document.getElementById('sizePaste');
    const sizePasteHasHeader = document.getElementById('sizePasteHasHeader');
    const previewSizeBtn = document.getElementById('previewSizeBtn');
    const pasteExampleBtn = document.getElementById('pasteExampleBtn');
    const sizePasteMsg = document.getElementById('sizePasteMsg');
    const sizePastePreview = document.getElementById('sizePastePreview');
    let parsedSizeRows = null;

    function normalizeHeader(s) {
      return String(s || '').trim().toUpperCase();
    }

    function detectDelimiter(text) {
      if (text.includes('\t')) return '\t';
      if (text.includes(',')) return ',';
      return '';
    }

    function splitLines(text) {
      return String(text || '')
        .replace(/\r\n/g, '\n')
        .replace(/\r/g, '\n')
        .split('\n')
        .map((x) => x.trim())
        .filter((x) => x);
    }

    function parseCsvLine(line) {
      const out = [];
      let cur = '';
      let inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') {
          if (inQ && line[i + 1] === '"') {
            cur += '"';
            i++;
          } else {
            inQ = !inQ;
          }
          continue;
        }
        if (!inQ && ch === ',') {
          out.push(cur.trim());
          cur = '';
          continue;
        }
        cur += ch;
      }
      out.push(cur.trim());
      return out;
    }

    function splitRow(line, delim) {
      if (delim === ',') return parseCsvLine(line);
      return line.split(delim).map((x) => String(x || '').trim());
    }

    function mapHeaderToKey(h) {
      const x = normalizeHeader(h);
      const map = {
        EU: 'eu',
        'EU SIZE': 'eu',
        SIZE: 'eu',
        '國際尺碼': 'eu',
        '國際尺碼(EU)': 'eu',
        '尺碼': 'eu',

        CHEST: 'chest',
        '胸圍': 'chest',
        '胸圍(CM)': 'chest',
        '胸圍CM': 'chest',

        WAIST: 'waist',
        '腰圍': 'waist',
        '腰圍(CM)': 'waist',
        '腰圍CM': 'waist',

        LENGTH: 'length',

        '衣長(CM)': 'length',
        '衣長CM': 'length',

        CHINA: 'china',
        'CHINA SIZE': 'china',

        '中國尺碼(HEIGHT/CHEST)': 'china',

        HEIGHT: 'height',
        'SUGGESTED HEIGHT': 'height',

      };
      return map[x] || '';
    }

    function parseSizeTableText(text, opts) {
      const header = !!(opts && opts.header);
      const lines = splitLines(text);
      if (!lines.length) return { ok: false, error: 'empty', rows: [], mapping: null };

      const delim = detectDelimiter(lines[0]);
      if (!delim) return { ok: false, error: 'delimiter', rows: [], mapping: null };

      const matrix = lines.map((ln) => splitRow(ln, delim));
      const mapping = { eu: -1, chest: -1, waist: -1, length: -1, china: -1, height: -1 };

      let start = 0;
      if (header) {
        const heads = matrix[0];
        heads.forEach((h, idx) => {
          const k = mapHeaderToKey(h);
          if (k && mapping[k] === -1) mapping[k] = idx;
        });
        start = 1;
      } else {
        mapping.eu = 0;
        mapping.chest = 1;
        mapping.waist = 2;
        mapping.length = 3;
        mapping.china = 4;
        mapping.height = 5;
      }

      const need = Object.entries(mapping)
        .filter(([, idx]) => idx < 0)
        .map(([k]) => k);
      if (need.length) return { ok: false, error: 'missing_columns', rows: [], mapping };

      const rows = [];
      for (let i = start; i < matrix.length; i++) {
        const r = matrix[i];
        const get = (k) => String(r[mapping[k]] || '').trim();
        const eu = get('eu');
        if (!eu) continue;
        rows.push({ eu, chest: get('chest'), waist: get('waist'), length: get('length'), china: get('china'), height: get('height') });
      }

      if (!rows.length) return { ok: false, error: 'no_rows', rows: [], mapping };
      return { ok: true, error: '', rows, mapping };
    }

        const attachments = Array.isArray(f.attachments) ? f.attachments : [];
        const attachHtml = attachments.length
          ? `<div class="mt-1 text-xs">${attachments.map((a) => `<a class="underline" href="${a.url}" target="_blank" rel="noreferrer">附件</a>`).join(' ')}</div>`
          : '';
        const tr = document.createElement('tr');
        tr.className = 'border-b';
        tr.innerHTML = `
          <td class="px-3 py-2 text-slate-700">${new Date(f.createdAt).toLocaleString('zh-HK')}</td>
          <td class="px-3 py-2 font-semibold">${f.orderSn}</td>
          <td class="px-3 py-2">${f.factoryName}</td>
          <td class="px-3 py-2">${f.content}${attachHtml}</td>
          <td class="px-3 py-2">${f.status}</td>
          <td class="px-3 py-2 text-right">
            <button data-id="${f.id}" data-status="已處理" class="markDone rounded-lg border bg-white px-3 py-1.5 text-xs font-semibold hover:bg-slate-50">標記已處理</button>
          </td>
        `;
        feedbackBody.appendChild(tr);
      });
      document.querySelectorAll('.markDone').forEach((b) => {
        b.addEventListener('click', async () => {
          const feedbackId = b.dataset.id;
          await apiFetch('/api/admin/feedback/status', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ feedbackId, status: '已處理' })
          });
          loadFeedback();
        });
      });
    }

    loadFeedbackBtn.addEventListener('click', loadFeedback);

    async function loadFactoryOrders() {
      const res = await apiFetch('/api/factory/orders', {});
      const data = await res.json().catch(() => null);
      if (!data || !data.ok) {
        appMsg.textContent = '載入工廠訂單失敗（需要 factory 角色）';
        return;
      }
      const list = data.orders || [];
      factoryBody.innerHTML = '';
      list.forEach((o) => {
        const tr = document.createElement('tr');
        tr.className = 'border-b';
        tr.innerHTML = `
          <td class="px-3 py-2 text-slate-700">${new Date(o.createdAt).toLocaleString('zh-HK')}</td>
          <td class="px-3 py-2 font-semibold">${o.orderSn}</td>
          <td class="px-3 py-2">${o.companyName}</td>
          <td class="px-3 py-2">${o.status}</td>
          <td class="px-3 py-2 text-right">
            <button data-id="${o.id}" class="detailBtn rounded-lg border bg-white px-3 py-1.5 text-xs font-semibold hover:bg-slate-50">詳情</button>
          </td>
        `;
        factoryBody.appendChild(tr);
      });
      document.querySelectorAll('.detailBtn').forEach((b) => {
        b.addEventListener('click', async () => {
          const id = b.dataset.id;
          const res = await apiFetch(`/api/factory/orders/${encodeURIComponent(id)}`, {});
          const data = await res.json().catch(() => null);
          if (!data || !data.ok) {
            appMsg.textContent = '載入詳情失敗';
            return;
          }
          const o = data.order;
          appMsg.textContent = `訂單 ${o.orderSn}：${o.status}`;
          factoryActiveOrderId = o.id;
          factoryOrderInfo.textContent = `訂單：${o.orderSn}｜公司：${o.companyName}｜狀態：${o.status}`;
          factoryStatusSel.value = o.status;
          factoryFeedbackText.value = '';
          factoryFiles.value = '';
          factoryModalMsg.textContent = '';
          factoryModal.classList.remove('hidden');
          factoryModal.classList.add('flex');
        });
      });
    }

    factoryUpdateStatusBtn.addEventListener('click', async () => {
      if (!factoryActiveOrderId) return;
      factoryModalMsg.textContent = '';
      const status = factoryStatusSel.value;
      const res = await apiFetch('/api/factory/orders/status', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId: factoryActiveOrderId, status })
      });
      const out = await res.json().catch(() => null);
      if (!out || !out.ok) {
        factoryModalMsg.textContent = '更新狀態失敗';
        return;
      }
      factoryModalMsg.textContent = '已更新狀態';
      await loadFactoryOrders();
    });

    factorySendFeedbackBtn.addEventListener('click', async () => {
      if (!factoryActiveOrderId) return;
      factoryModalMsg.textContent = '';
      const content = factoryFeedbackText.value.trim();
      if (!content) {
        factoryModalMsg.textContent = '請輸入反饋內容';
        return;
      }

      const files = Array.from(factoryFiles.files || []);
      if (files.length > 3) {
        factoryModalMsg.textContent = '最多 3 張附件';
        return;
      }
      for (const f of files) {
        if (f.size > 500 * 1024) {
          factoryModalMsg.textContent = '附件太大（>500KB）';
          return;
        }
      }

      const attachments = [];
      for (const f of files) {
        const dataUrl = await new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result || ''));
          reader.onerror = reject;
          reader.readAsDataURL(f);
        });
        const up = await apiFetch('/api/factory/upload', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ filename: f.name, dataUrl })
        });
        const upOut = await up.json().catch(() => null);
        if (!upOut || !upOut.ok || !upOut.url) {
          factoryModalMsg.textContent = '上傳附件失敗';
          return;
        }
        attachments.push({ url: upOut.url, name: f.name, contentType: upOut.contentType || '', size: f.size });
      }

      const res = await apiFetch('/api/factory/feedback', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ orderId: factoryActiveOrderId, content, attachments })
      });
      const out = await res.json().catch(() => null);
      if (!out || !out.ok) {
        factoryModalMsg.textContent = '提交反饋失敗';
        return;
      }
      factoryModalMsg.textContent = '已提交反饋';
      factoryFeedbackText.value = '';
      factoryFiles.value = '';
      if (sessionRole() === 'admin') await loadFeedback().catch(() => null);
    });

    loadFactoryOrdersBtn.addEventListener('click', loadFactoryOrders);

    async function init() {
      if (sessionToken()) await showApp();
      else showLogin();
      if (sessionToken()) {
        await loadSizes().catch(() => null);
      }
    }

    init();
  </script>
</body>
</html>
