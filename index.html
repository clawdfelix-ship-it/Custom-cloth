<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>客戶訂單下單系統</title>
  <style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:"Microsoft JhengHei",sans-serif;}
    body{background:#f3f4f6;color:#333;max-width:880px;margin:0 auto;padding:20px;}
    .card{background:#fff;padding:25px;border-radius:12px;margin-bottom:20px;box-shadow:0 2px 8px rgba(0,0,0,0.05);}
    .card-title{font-size:20px;font-weight:bold;margin-bottom:20px;padding-bottom:10px;border-bottom:1px solid #eee;}
    .form-item{margin-bottom:15px;}
    .form-item label{display:block;margin-bottom:6px;font-weight:500;}
    .form-item input,select,textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:8px;font-size:15px;}
    .btn{width:100%;padding:14px;border:none;border-radius:8px;background:#3b82f6;color:#fff;font-size:16px;cursor:pointer;font-weight:bold;}
    .btn:hover{background:#2563eb;}
    .btn-sm{padding:8px 12px;width:auto;font-size:14px;}
    .btn-success{background:#10b981;}
    .btn-warning{background:#f59e0b;}
    .btn-secondary{background:#6b7280;}
    .tab-group{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
    .tab-btn{flex:1;min-width:160px;padding:12px;border:none;border-radius:8px;background:#e5e7eb;cursor:pointer;font-size:15px;}
    .tab-btn.active{background:#3b82f6;color:#fff;}
    .hide{display:none !important;}
    .style-item{border:1px solid #eee;padding:12px;border-radius:8px;margin-bottom:10px;display:flex;align-items:center;gap:15px;flex-wrap:wrap;}
    .style-item img{width:80px;height:80px;object-fit:cover;border-radius:8px;border:1px solid #ddd;background:#fff;}
    .style-info{flex:1;min-width:220px;}
    .size-qty-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:15px;}
    .size-qty-row input{text-align:center;}
    .size-table-preview{background:#f8f9fa;padding:10px;border-radius:8px;margin-top:10px;overflow-x:auto;}
    table{width:100%;border-collapse:collapse;}
    th,td{padding:8px;border:1px solid #ddd;text-align:center;font-size:13px;}
    th{background:#f9fafb;}
    .note-red{color:#dc2626;font-weight:bold;margin:8px 0;}
    .note-green{color:#059669;font-weight:bold;margin:8px 0;}
    .muted{color:#6b7280;font-size:13px;}
    .result-box{background:#f9fafb;border:1px solid #e5e7eb;padding:12px;border-radius:10px;margin-top:10px;}
  </style>
</head>
<body>
  <div class="card">
    <div class="card-title">客戶訂單下單系統</div>
    <div class="tab-group">
      <button id="btn-new" class="tab-btn active" type="button" onclick="switchTab('new')">全新款式下單</button>
      <button id="btn-repeat" class="tab-btn" type="button" onclick="switchTab('repeat')">歷史訂單翻單</button>
      <button id="btn-query" class="tab-btn" type="button" onclick="switchTab('query')">訂單狀態查詢</button>
    </div>

    <div id="tab-new" class="tab-content">
      <div class="note-red">開板訂製（全新款）最低工期：31 工作日</div>
      <div class="note-green">現貨加工/熱昇華訂製、任何翻單：最低工期：17 工作日</div>

      <div class="form-item">
        <label>訂製大分類</label>
        <select id="cate1" onchange="onCate1Changed()">
          <option value="">請選擇訂製類型</option>
        </select>
      </div>
      <div class="form-item">
        <label>產品子分類</label>
        <select id="cate2" onchange="onCate2Changed()">
          <option value="">請選擇產品類型</option>
        </select>
      </div>

      <div id="jerseyWrap" class="form-item hide">
        <label>球衣子類</label>
        <select id="cate3" onchange="onCate3Changed()">
          <option value="">請選擇</option>
          <option value="足球">足球</option>
          <option value="籃球">籃球</option>
          <option value="排球">排球</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div id="jerseyPartWrap" class="form-item hide">
        <label>再子類</label>
        <select id="cate4" onchange="onCate4Changed()">
          <option value="">請選擇</option>
          <option value="上衣">上衣</option>
          <option value="褲子">褲子</option>
          <option value="整套">整套</option>
        </select>
      </div>

      <div class="form-item">
        <label>選擇款式</label>
        <div id="styleList"></div>
        <div id="styleHint" class="muted">請先選擇分類後載入款式。</div>
      </div>

      <div id="sizeWrap" class="hide">
        <div class="form-item">
          <label>尺碼表參考</label>
          <div id="sizeTablePreview" class="size-table-preview"></div>
        </div>

        <div class="form-item">
          <label>填寫各尺碼數量</label>
          <div id="qtyWrap" class="size-qty-row"></div>
        </div>

        <div class="form-item">
          <label>要求交貨日期</label>
          <input type="date" id="deliveryDate">
          <div id="minDateHint" class="muted"></div>
        </div>

        <div class="form-item">
          <label>公司名</label>
          <input type="text" id="companyName" placeholder="請輸入公司名">
        </div>
        <div class="form-item">
          <label>聯絡人</label>
          <input type="text" id="contactName" placeholder="請輸入聯絡人">
        </div>
        <div class="form-item">
          <label>電話</label>
          <input type="text" id="phone" placeholder="請輸入電話">
        </div>
        <div class="form-item">
          <label>送貨地址</label>
          <input type="text" id="address" placeholder="請輸入送貨地址">
        </div>

        <button class="btn btn-success" type="button" onclick="submitOrder('new')">提交訂單</button>
        <div id="newMsg" class="muted"></div>
        <div id="newResult" class="result-box hide"></div>
      </div>
    </div>

    <div id="tab-repeat" class="tab-content hide">
      <div class="form-item">
        <label>公司名</label>
        <input type="text" id="repeatCompanyName" placeholder="請輸入之前落單公司名">
      </div>
      <div class="form-item">
        <label>電話</label>
        <input type="text" id="repeatPhone" placeholder="請輸入之前落單電話">
      </div>
      <button class="btn btn-warning" type="button" onclick="searchMyOrder()">查找歷史訂單</button>
      <div id="repeatMsg" class="muted"></div>

      <div id="repeatList" class="result-box hide"></div>

      <div id="repeatSelected" class="result-box hide"></div>
      <div id="repeatAction" class="hide" style="margin-top:10px;">
        <button class="btn btn-success" type="button" onclick="submitOrder('repeat')">確認翻單並提交</button>
      </div>
    </div>

    <div id="tab-query" class="tab-content hide">
      <div class="form-item">
        <label>訂單編號</label>
        <input type="text" id="queryOrderSn" placeholder="例如：ORD20260509123456-abcdef">
      </div>
      <div class="form-item">
        <label>查單碼（推薦）</label>
        <input type="text" id="queryLookupCode" placeholder="請輸入提交成功後顯示嘅查單碼">
      </div>
      <div class="form-item">
        <label>電話（兼容舊單）</label>
        <input type="text" id="queryPhone" placeholder="如冇查單碼，先輸入落單電話">
      </div>
      <button class="btn btn-secondary" type="button" onclick="queryOrder()">查詢訂單狀態</button>
      <div id="queryMsg" class="muted"></div>
      <div id="queryResult" class="result-box hide"></div>
    </div>
  </div>

  <script>
    let holidays = new Set();
    let stylesCache = [];
    let selectedStyleIds = new Set();
    let selectedSizeTableId = '';
    let repeatSelectedOrder = null;
    let categoriesCache = { cate1: [], cate2ByCate1: {} };
    let customerProvided = { enabled: false, text: '', images: [] };

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function switchTab(tab) {
      document.getElementById('tab-new').classList.add('hide');
      document.getElementById('tab-repeat').classList.add('hide');
      document.getElementById('tab-query').classList.add('hide');
      document.getElementById('btn-new').classList.remove('active');
      document.getElementById('btn-repeat').classList.remove('active');
      document.getElementById('btn-query').classList.remove('active');

      document.getElementById(`tab-${tab}`).classList.remove('hide');
      document.getElementById(`btn-${tab}`).classList.add('active');
    }

    function pad(n) { return String(n).padStart(2, '0'); }
    function addDaysYmd(ymd, days) {
      const d = new Date(`${ymd}T00:00:00.000Z`);
      d.setUTCDate(d.getUTCDate() + days);
      return d.toISOString().slice(0, 10);
    }
    function isWeekend(ymd) {
      const d = new Date(`${ymd}T00:00:00.000Z`);
      const day = d.getUTCDay();
      return day === 0 || day === 6;
    }
    function addBusinessDays(startYmd, businessDays) {
      let cursor = String(startYmd);
      let left = Number(businessDays);
      while (left > 0) {
        cursor = addDaysYmd(cursor, 1);
        if (isWeekend(cursor)) continue;
        if (holidays.has(cursor)) continue;
        left -= 1;
      }
      return cursor;
    }
    function hkTodayYmd() {
      return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Hong_Kong' });
    }
    function leadDays(mode) {
      if (mode === 'repeat') return 17;
      const c1 = document.getElementById('cate1').value;
      return c1 === '開板訂製' ? 31 : 17;
    }
    function updateMinDelivery(mode) {
      const lead = leadDays(mode);
      const earliest = addBusinessDays(hkTodayYmd(), lead);
      const el = document.getElementById('deliveryDate');
      el.min = earliest;
      if (!el.value || el.value < earliest) el.value = earliest;
      document.getElementById('minDateHint').textContent = `最快交貨日：${earliest}（今天16:00前確認訂單細節後計算出的最快交貨日）`;
    }

    function setCateOptions(selectEl, placeholder, values) {
      const v = selectEl.value;
      selectEl.innerHTML = `<option value="">${placeholder}</option>` + (values || []).map((x) => `<option value="${x}">${x}</option>`).join('');
      if (v && (values || []).includes(v)) selectEl.value = v;
      else selectEl.value = '';
    }

    async function loadCategories() {
      const res = await fetch('/api/public/categories');
      const data = await res.json().catch(() => null);
      if (!data || !data.ok) return;
      categoriesCache = {
        cate1: Array.isArray(data.cate1) ? data.cate1 : [],
        cate2ByCate1: data.cate2ByCate1 && typeof data.cate2ByCate1 === 'object' ? data.cate2ByCate1 : {}
      };
      const cate1El = document.getElementById('cate1');
      setCateOptions(cate1El, '請選擇訂製類型', categoriesCache.cate1);
      onCate1Changed();
    }

    function onCate1Changed() {
      const cate1 = document.getElementById('cate1').value;
      const cate2El = document.getElementById('cate2');
      const list = cate1 && categoriesCache.cate2ByCate1[cate1] ? categoriesCache.cate2ByCate1[cate1] : [];
      setCateOptions(cate2El, '請選擇產品類型', list);
      document.getElementById('cate3').value = '';
      document.getElementById('cate4').value = '';
      document.getElementById('jerseyWrap').classList.add('hide');
      document.getElementById('jerseyPartWrap').classList.add('hide');
      filterStyle();
    }

    function onCate2Changed() {
      const cate2 = document.getElementById('cate2').value;
      if (cate2 === '球衣') {
        document.getElementById('jerseyWrap').classList.remove('hide');
        document.getElementById('jerseyPartWrap').classList.remove('hide');
      } else {
        document.getElementById('cate3').value = '';
        document.getElementById('cate4').value = '';
        document.getElementById('jerseyWrap').classList.add('hide');
        document.getElementById('jerseyPartWrap').classList.add('hide');
      }
      filterStyle();
    }

    function onCate3Changed() {
      filterStyle();
    }

    function onCate4Changed() {
      filterStyle();
    }

    async function filterStyle() {
      const cate1 = document.getElementById('cate1').value;
      const cate2 = document.getElementById('cate2').value;
      const cate3 = document.getElementById('cate3').value;
      const cate4 = document.getElementById('cate4').value;
      selectedStyleIds = new Set();
      selectedSizeTableId = '';
      document.getElementById('sizeWrap').classList.add('hide');
      document.getElementById('styleList').innerHTML = '';
      document.getElementById('styleHint').classList.remove('hide');

      if (!cate1 || !cate2) return;
      if (cate2 === '球衣' && (!cate3 || !cate4)) {
        document.getElementById('styleHint').textContent = '請先選擇：球衣子類及再子類';
        return;
      }

      const qs = new URLSearchParams();
      qs.set('cate1', cate1);
      qs.set('cate2', cate2);
      if (cate2 === '球衣') {
        qs.set('cate3', cate3);
        qs.set('cate4', cate4);
      }
      const res = await fetch(`/api/public/styles?${qs.toString()}`);
      const data = await res.json().catch(() => null);
      if (!data || !data.ok) {
        document.getElementById('styleHint').textContent = '載入款式失敗';
        return;
      }

      stylesCache = data.styles || [];
      renderStyles(stylesCache);
      document.getElementById('styleHint').classList.add('hide');
      updateMinDelivery('new');
    }

    function renderStyles(styles) {
      const wrap = document.getElementById('styleList');
      wrap.innerHTML = '';
      if (!styles.length) {
        document.getElementById('styleHint').textContent = '此分類暫無款式';
        document.getElementById('styleHint').classList.remove('hide');
        return;
      }
      styles.forEach((s) => {
        const div = document.createElement('div');
        div.className = 'style-item';
        const imgSrc = s.imgUrl || s.imgBase64 || 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
        const img = `<img src="${imgSrc}" alt="${escapeHtml(s.name)}">`;
        div.innerHTML = `
          ${img}
          <div class="style-info">
            <div style="font-weight:bold;">${escapeHtml(s.code)} - ${escapeHtml(s.name)}</div>
            <div class="muted">${escapeHtml(s.cate1)} / ${escapeHtml(s.cate2)}</div>
            <div class="muted">尺碼表：${escapeHtml(s.sizeTableName)}</div>
          </div>
          <div>
            <label style="display:flex;gap:8px;align-items:center;">
              <input type="checkbox" data-style-id="${s.id}">
              選擇
            </label>
          </div>
        `;
        div.querySelector('input[type="checkbox"]').addEventListener('change', async (e) => {
          if (e.target.checked) selectedStyleIds.add(s.id);
          else selectedStyleIds.delete(s.id);
          await onStyleSelectionChanged();
        });
        wrap.appendChild(div);
      });

      const customer = styles.find((x) => x && x.code === 'CUSTOMER_PROVIDED');
      if (customer) renderCustomerProvidedBlock(customer);
    }

    function renderCustomerProvidedBlock(style) {
      const wrap = document.getElementById('styleList');
      const div = document.createElement('div');
      div.className = 'style-item';
      div.innerHTML = `
        <div class="style-info" style="width:100%;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
            <div style="font-weight:bold;">${escapeHtml(style.name)}</div>
            <label style="display:flex;gap:8px;align-items:center;">
              <input type="checkbox" id="customerProvidedChk">
              選擇
            </label>
          </div>
          <div class="muted">客戶自行提供款式參考圖及描述</div>
          <div id="customerProvidedForm" class="hide" style="margin-top:10px;">
            <div class="form-item" style="margin:0 0 10px 0;">
              <label>描述</label>
              <textarea id="customerProvidedText" rows="3" placeholder="例如：自備球衣款式／想做成類似某款..." style="width:100%;padding:10px;border:1px solid #e5e7eb;border-radius:10px;"></textarea>
            </div>
            <div class="form-item" style="margin:0;">
              <label>參考圖（最多 3 張）</label>
              <input id="customerProvidedImages" type="file" accept="image/*" multiple>
              <div id="customerProvidedPreview" class="muted" style="margin-top:6px;"></div>
            </div>
          </div>
        </div>
      `;
      wrap.appendChild(div);

      const chk = div.querySelector('#customerProvidedChk');
      chk.addEventListener('change', async () => {
        customerProvided.enabled = !!chk.checked;
        const form = div.querySelector('#customerProvidedForm');
        if (chk.checked) {
          selectedStyleIds.add(style.id);
          form.classList.remove('hide');
        } else {
          selectedStyleIds.delete(style.id);
          form.classList.add('hide');
          customerProvided.text = '';
          customerProvided.images = [];
          div.querySelector('#customerProvidedText').value = '';
          div.querySelector('#customerProvidedImages').value = '';
          div.querySelector('#customerProvidedPreview').textContent = '';
        }
        await onStyleSelectionChanged();
      });

      div.querySelector('#customerProvidedText').addEventListener('input', (e) => {
        customerProvided.text = String(e.target.value || '').trim();
      });

      div.querySelector('#customerProvidedImages').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files || []).slice(0, 3);
        const urls = [];
        for (const f of files) {
          if (!f || !f.type || !/^image\//.test(f.type)) continue;
          if (f.size > 500 * 1024) continue;
          const b64 = await new Promise((resolve) => {
            const r = new FileReader();
            r.onload = () => resolve(String(r.result || ''));
            r.onerror = () => resolve('');
            r.readAsDataURL(f);
          });
          if (b64) urls.push(b64);
        }
        customerProvided.images = urls;
        div.querySelector('#customerProvidedPreview').textContent = urls.length ? `已選擇 ${urls.length} 張` : '';
      });
    }

    function getCustomerProvidedStyle() {
      return stylesCache.find((s) => s && s.code === 'CUSTOMER_PROVIDED') || null;
    }

    async function onStyleSelectionChanged() {
      if (!selectedStyleIds.size) {
        document.getElementById('sizeWrap').classList.add('hide');
        selectedSizeTableId = '';
        return;
      }

      const firstId = Array.from(selectedStyleIds)[0];
      const style = stylesCache.find((x) => x.id === firstId);
      if (!style) return;
      const customer = getCustomerProvidedStyle();
      if (customer && selectedStyleIds.size === 1 && String(customer.id) === String(firstId)) {
        selectedSizeTableId = customer.sizeTableId;
        await loadSizeTable(selectedSizeTableId);
        document.getElementById('sizeWrap').classList.remove('hide');
        updateMinDelivery('new');
        return;
      }
      if (selectedSizeTableId !== style.sizeTableId) {
        selectedSizeTableId = style.sizeTableId;
        await loadSizeTable(selectedSizeTableId);
      }
      document.getElementById('sizeWrap').classList.remove('hide');
      updateMinDelivery('new');
    }

    async function loadSizeTable(id) {
      const res = await fetch(`/api/public/size-tables/${encodeURIComponent(id)}`);
      const data = await res.json().catch(() => null);
      if (!data || !data.ok) {
        document.getElementById('sizeTablePreview').innerHTML = '載入尺碼表失敗';
        return;
      }
      const st = data.sizeTable;
      const rows = Array.isArray(st.data) ? st.data : [];
      const hasLength = rows.some((r) => r && r.length != null && String(r.length).trim() !== '');
      const hasChest = rows.some((r) => r && r.chest != null && String(r.chest).trim() !== '');
      const hasWaist = rows.some((r) => r && r.waist != null && String(r.waist).trim() !== '');
      const hasSeat = rows.some((r) => r && r.seat != null && String(r.seat).trim() !== '');
      const hasChina = rows.some((r) => r && r.china != null && String(r.china).trim() !== '');
      const hasHeight = rows.some((r) => r && r.height != null && String(r.height).trim() !== '');

      const cols = [
        { key: 'eu', label: 'EU' },
        ...(hasLength ? [{ key: 'length', label: '衣長' }] : []),
        ...(hasChest ? [{ key: 'chest', label: '胸圍' }] : []),
        ...(hasWaist ? [{ key: 'waist', label: '腰圍' }] : []),
        ...(hasSeat ? [{ key: 'seat', label: '臀圍' }] : []),
        ...(hasChina ? [{ key: 'china', label: '中國碼' }] : []),
        ...(hasHeight ? [{ key: 'height', label: '身高' }] : [])
      ];

      const html = `
        <table>
          <thead><tr>${cols.map((c) => `<th>${c.label}</th>`).join('')}</tr></thead>
          <tbody>
            ${rows.map((r) => `<tr>${cols.map((c) => `<td>${(r && r[c.key]) != null ? escapeHtml(String(r[c.key])) : ''}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>
      `;
      document.getElementById('sizeTablePreview').innerHTML = html;

      const sizes = rows.map((r) => (r && r.eu != null ? String(r.eu).trim() : '')).filter(Boolean);
      renderQtyInputs(sizes, null);
    }

    function renderQtyInputs(sizes, preset) {
      const wrap = document.getElementById('qtyWrap');
      const list = Array.isArray(sizes) ? sizes.map(String).map((s) => s.trim()).filter(Boolean) : [];
      const seen = new Set();
      const uniq = list.filter((s) => {
        if (seen.has(s)) return false;
        seen.add(s);
        return true;
      });

      const presetMap = new Map();
      if (Array.isArray(preset)) {
        preset.forEach((x) => {
          const size = x && x.size != null ? String(x.size).trim() : '';
          const qty = Number(x && x.qty);
          if (size) presetMap.set(size, Number.isFinite(qty) ? qty : 0);
        });
      }

      wrap.innerHTML = uniq
        .map(
          (s) => `
          <div>
            <label>${s}</label>
            <input type="number" data-size="${s}" value="${presetMap.has(s) ? presetMap.get(s) : 0}" min="0">
          </div>
        `
        )
        .join('');
    }

    function readQty() {
      const inputs = Array.from(document.querySelectorAll('#qtyWrap input[data-size]'));
      const out = inputs.map((el) => {
        const size = String(el.getAttribute('data-size') || '').trim();
        const n = Number(el.value || 0);
        return { size, qty: Number.isFinite(n) ? n : 0 };
      });
      return out;
    }

    async function submitOrder(mode) {
      const msgId = mode === 'repeat' ? 'repeatMsg' : 'newMsg';
      const msgEl = document.getElementById(msgId);
      msgEl.textContent = '';

      let cate1 = document.getElementById('cate1').value;
      let cate2 = document.getElementById('cate2').value;

      if (mode === 'repeat') {
        if (!repeatSelectedOrder) {
          msgEl.textContent = '請先選擇一張歷史訂單';
          return;
        }
        cate1 = repeatSelectedOrder.cate1;
        cate2 = repeatSelectedOrder.cate2;
      }

      if (!cate1 || !cate2) {
        msgEl.textContent = '請先選擇分類';
        return;
      }

      if (!selectedStyleIds.size && mode !== 'repeat') {
        msgEl.textContent = '請選擇至少一個款式';
        return;
      }

      const qty = readQty();
      const qtyTotal = qty.reduce((a, b) => a + Number(b && b.qty ? b.qty : 0), 0);
      if (qtyTotal <= 0) {
        msgEl.textContent = '請填寫尺碼數量';
        return;
      }

      const companyName = (mode === 'repeat' ? document.getElementById('repeatCompanyName').value : document.getElementById('companyName').value).trim();
      const phone = (mode === 'repeat' ? document.getElementById('repeatPhone').value : document.getElementById('phone').value).trim();
      const contactName = document.getElementById('contactName').value.trim();
      const address = document.getElementById('address').value.trim();
      const requestedDeliveryDate = document.getElementById('deliveryDate').value;

      if (!companyName || !phone) {
        msgEl.textContent = '請填公司名及電話';
        return;
      }
      if (!address) {
        msgEl.textContent = '請填送貨地址';
        return;
      }

      updateMinDelivery(mode);
      if (requestedDeliveryDate < document.getElementById('deliveryDate').min) {
        msgEl.textContent = '交貨日過早，請重新選擇';
        return;
      }

      const styleIds = mode === 'repeat' ? new Set(repeatSelectedOrder.items.map((it) => String(it.styleId))) : selectedStyleIds;
      const items = Array.from(styleIds).map((styleId) => ({ styleId, qty }));
      if (mode !== 'repeat' && customerProvided.enabled) {
        const customerStyle = getCustomerProvidedStyle();
        const idx = items.findIndex((x) => customerStyle && String(x.styleId) === String(customerStyle.id));
        const payload = { customText: customerProvided.text, customImages: customerProvided.images };
        if (idx >= 0) items[idx] = { ...items[idx], ...payload };
        else if (customerStyle) items.push({ styleId: customerStyle.id, qty, ...payload });
      }

      const payload = {
        mode,
        cate1,
        cate2,
        cate3: cate2 === '球衣' ? document.getElementById('cate3').value : '',
        cate4: cate2 === '球衣' ? document.getElementById('cate4').value : '',
        companyName,
        contactName,
        phone,
        address,
        requestedDeliveryDate,
        sourceOrderId: mode === 'repeat' ? repeatSelectedOrder.id : null,
        items
      };

      const res = await fetch('/api/public/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => null);
      if (!data || !data.ok) {
        if (data && data.error === 'delivery_date_too_early' && data.suggestedDeliveryDate) {
          msgEl.textContent = `交貨日過早，最快：${data.suggestedDeliveryDate}`;
        } else {
          msgEl.textContent = '提交失敗';
        }
        return;
      }

      const boxId = mode === 'repeat' ? 'repeatSelected' : 'newResult';
      const box = document.getElementById(boxId);
      box.classList.remove('hide');
      box.innerHTML = `<div style="font-weight:bold;">提交成功</div>
        <div>訂單編號：<b>${escapeHtml(data.orderSn)}</b></div>
        <div>查單碼：<b>${escapeHtml(data.lookupCode || '')}</b></div>
        <div>狀態：${escapeHtml(data.status)}</div>
        <div>建議交貨日：${escapeHtml(data.suggestedDeliveryDate)}</div>`;

      if (mode !== 'repeat') {
        msgEl.textContent = '';
      } else {
        document.getElementById('repeatAction').classList.add('hide');
      }
    }

    async function searchMyOrder() {
      const companyName = document.getElementById('repeatCompanyName').value.trim();
      const phone = document.getElementById('repeatPhone').value.trim();
      const msg = document.getElementById('repeatMsg');
      msg.textContent = '';
      repeatSelectedOrder = null;
      document.getElementById('repeatSelected').classList.add('hide');
      document.getElementById('repeatAction').classList.add('hide');

      if (!companyName || !phone) {
        msg.textContent = '請輸入公司名及電話';
        return;
      }

      const res = await fetch(`/api/public/orders/history?companyName=${encodeURIComponent(companyName)}&phone=${encodeURIComponent(phone)}`);
      const data = await res.json().catch(() => null);
      if (!data || !data.ok) {
        msg.textContent = '查找失敗';
        return;
      }

      const orders = data.orders || [];
      const listBox = document.getElementById('repeatList');
      listBox.classList.remove('hide');
      if (!orders.length) {
        listBox.textContent = '沒有找到歷史訂單';
        return;
      }

      listBox.innerHTML = orders.map((o) => {
        const styles = (o.items || []).map((it) => it.styleName || it.styleCode || '').filter(Boolean).join('、');
        return `<div style="padding:10px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:10px;">
          <div><b>${escapeHtml(o.orderSn)}</b> <span class="muted">(${new Date(o.createdAt).toLocaleString('zh-HK')})</span></div>
          <div class="muted">${escapeHtml(o.orderType)} / ${escapeHtml(o.status)}</div>
          <div class="muted">款式：${escapeHtml(styles || '—')}</div>
          <button class="btn btn-sm" type="button" onclick="selectHistoryOrder('${escapeHtml(o.id)}')">選擇此訂單翻單</button>
        </div>`;
      }).join('');

      window.__historyOrders = orders;
      updateMinDelivery('repeat');
    }

    function selectHistoryOrder(id) {
      const orders = window.__historyOrders || [];
      const o = orders.find((x) => x.id === id);
      if (!o) return;
      repeatSelectedOrder = o;

      const items = Array.isArray(o.items) ? o.items : [];
      const firstQty = items[0] && items[0].qty ? items[0].qty : null;
      if (Array.isArray(firstQty) && firstQty.length) {
        const sizes = firstQty.map((x) => String(x && x.size ? x.size : '')).filter(Boolean);
        renderQtyInputs(sizes, firstQty);
      }

      document.getElementById('repeatSelected').classList.remove('hide');
      document.getElementById('repeatSelected').innerHTML = `<div style="font-weight:bold;">已選擇翻單</div>
        <div>原訂單：<b>${escapeHtml(o.orderSn)}</b></div>
        <div class="muted">${escapeHtml(o.orderType)} / ${escapeHtml(o.status)}</div>`;

      document.getElementById('repeatAction').classList.remove('hide');
      updateMinDelivery('repeat');
      switchTab('repeat');
    }

    async function queryOrder() {
      const orderSn = document.getElementById('queryOrderSn').value.trim();
      const lookupCode = document.getElementById('queryLookupCode').value.trim();
      const phone = document.getElementById('queryPhone').value.trim();
      const msg = document.getElementById('queryMsg');
      const box = document.getElementById('queryResult');
      msg.textContent = '';
      box.classList.add('hide');
      box.innerHTML = '';

      if (!orderSn || (!lookupCode && !phone)) {
        msg.textContent = '請輸入訂單編號 + 查單碼（或電話）';
        return;
      }

      const qs = new URLSearchParams();
      qs.set('orderSn', orderSn);
      if (lookupCode) qs.set('lookupCode', lookupCode);
      else qs.set('phone', phone);

      const res = await fetch(`/api/public/orders/status?${qs.toString()}`);
      const data = await res.json().catch(() => null);
      if (!data || !data.ok) {
        msg.textContent = '找不到訂單或資料不匹配';
        return;
      }

      const o = data.order;
      box.classList.remove('hide');
      box.innerHTML = `<div style="font-weight:bold;">訂單狀態</div>
        <div>訂單編號：<b>${escapeHtml(o.orderSn)}</b></div>
        <div>公司：${escapeHtml(o.companyName)}</div>
        <div>狀態：<b>${escapeHtml(o.status)}</b></div>
        <div>建議交貨日：${escapeHtml(o.suggestedDeliveryDate || '—')}</div>
        <div>客戶交貨日：${escapeHtml(o.requestedDeliveryDate || '—')}</div>
        <div class="muted">分類：${escapeHtml(o.cate1)} / ${escapeHtml(o.cate2)}</div>`;
    }

    async function init() {
      const r = await fetch('/data/hk-holidays/2026.json').catch(() => null);
      const list = r ? await r.json().catch(() => []) : [];
      holidays = new Set(Array.isArray(list) ? list.map(String) : []);
      await loadCategories().catch(() => null);
    }

    init();
  </script>
</body>
