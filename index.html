<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f6f8fb">
  <title>ZENEX-SPORTS｜客戶訂單下單系統</title>
  <link rel="stylesheet" href="/assets/zenex.css">
  <style>
    *{margin:0;padding:0;box-sizing:border-box;}
    body{margin:0;}
    .zenex-shell{max-width:980px;margin:0 auto;padding:18px 16px 40px;}
    .zenex-topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:14px 16px;}
    .zenex-brand{font-weight:900;letter-spacing:.3px;}
    .zenex-subtitle{color:var(--zenex-muted);font-size:13px;margin-top:2px;}

    .card{padding:24px;margin-top:16px;}
    .card-title{font-size:20px;font-weight:900;margin-bottom:16px;padding-bottom:12px;border-bottom:1px solid var(--zenex-border);}
    .form-item{margin-bottom:15px;}
    .form-item label{display:block;margin-bottom:6px;font-weight:700;}
    .form-item input:not([type="checkbox"]):not([type="radio"]):not([type="file"]),
    .form-item select,
    .form-item textarea{width:100%;padding:12px 14px;border:1px solid var(--zenex-border);border-radius:var(--zenex-radius-control);font-size:15px;background:#fff;color:var(--zenex-text);}
    .form-item input:not([type="checkbox"]):not([type="radio"]):not([type="file"]):focus-visible,
    .form-item select:focus-visible,
    .form-item textarea:focus-visible{outline:3px solid rgba(0,102,255,.25);outline-offset:2px;}

    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:12px 16px;border:1px solid transparent;border-radius:var(--zenex-radius-control);background:var(--zenex-brand-500);color:#fff;font-size:16px;cursor:pointer;font-weight:800;text-decoration:none;}
    .btn:hover{background:var(--zenex-brand-600);}
    .btn:focus-visible{outline:3px solid rgba(0,102,255,.25);outline-offset:2px;}
    .btn-sm{padding:8px 12px;width:auto;font-size:14px;}
    .btn-success{background:var(--zenex-success);}
    .btn-success:hover{filter:brightness(.95);}
    .btn-warning{background:var(--zenex-warning);color:#111827;}
    .btn-warning:hover{filter:brightness(.95);}
    .btn-secondary{background:#fff;border-color:var(--zenex-border);color:var(--zenex-text);}
    .btn-secondary:hover{background:var(--zenex-brand-50);}

    .tab-group{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;}
    .tab-btn{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--zenex-border);border-radius:var(--zenex-radius-control);background:#fff;cursor:pointer;font-size:15px;font-weight:800;color:var(--zenex-text);}
    .tab-btn:hover{background:var(--zenex-brand-50);}
    .tab-btn.active{background:var(--zenex-brand-500);border-color:var(--zenex-brand-500);color:#fff;}
    .tab-btn:focus-visible{outline:3px solid rgba(0,102,255,.25);outline-offset:2px;}
    .hide{display:none !important;}
    .style-item{border:1px solid var(--zenex-border);background:#fff;padding:12px;border-radius:var(--zenex-radius-control);margin-bottom:10px;display:flex;align-items:center;gap:15px;flex-wrap:wrap;}
    .style-item img{width:80px;height:80px;object-fit:cover;border-radius:var(--zenex-radius-control);border:1px solid var(--zenex-border);background:#fff;}
    .style-info{flex:1;min-width:220px;}
    .size-qty-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;margin-top:15px;}
    .size-qty-row input{text-align:center;}
    .size-table-preview{background:var(--zenex-brand-50);padding:10px;border-radius:var(--zenex-radius-control);margin-top:10px;overflow-x:auto;border:1px solid var(--zenex-border);}
    table{width:100%;border-collapse:collapse;}
    th,td{padding:8px;border:1px solid var(--zenex-border);text-align:center;font-size:13px;background:#fff;}
    th{background:var(--zenex-brand-50);font-weight:800;}
    .note-red{color:#dc2626;font-weight:bold;margin:8px 0;}
    .note-green{color:#059669;font-weight:bold;margin:8px 0;}
    .muted{color:var(--zenex-muted);font-size:13px;}
    .result-box{background:#fff;border:1px solid var(--zenex-border);padding:12px;border-radius:var(--zenex-radius-control);margin-top:10px;}
    .zenex-skip{position:absolute;left:-9999px;top:10px;background:#fff;border:1px solid var(--zenex-border);padding:10px 12px;border-radius:12px;z-index:50;box-shadow:var(--zenex-shadow);}
    .zenex-skip:focus-visible{left:16px;}
  </style>
</head>
<body class="zenex-page">
  <a class="zenex-skip" href="#main">跳至主要內容</a>
  <div class="zenex-shell">
    <header class="zenex-topbar zenex-header zenex-card">
      <div>
        <div class="zenex-brand">ZENEX-SPORTS</div>
        <div class="zenex-subtitle">客戶訂單下單系統</div>
      </div>
      <a class="btn btn-sm btn-secondary" href="/admin">後台</a>
    </header>

  <main id="main">
  <div class="card zenex-card">
    <div class="card-title">客戶訂單下單系統</div>

    <div id="customerAuthCard" class="result-box" style="margin-bottom:16px;">
      <div id="customerAuthLoggedOut">
        <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;">
          <button id="customerLoginTab" class="btn btn-sm btn-secondary" type="button" onclick="setCustomerAuthMode('login')">登入</button>
          <button id="customerRegisterTab" class="btn btn-sm btn-secondary" type="button" onclick="setCustomerAuthMode('register')">註冊</button>
        </div>

        <div id="customerLogin">
          <div class="form-item">
            <label for="customerLoginEmail">Email</label>
            <input type="email" id="customerLoginEmail" autocomplete="email" placeholder="例如：name@example.com" spellcheck="false">
          </div>
          <div class="form-item">
            <label for="customerLoginPassword">密碼</label>
            <input type="password" id="customerLoginPassword" autocomplete="current-password" placeholder="請輸入密碼" spellcheck="false">
          </div>
          <button class="btn btn-success" type="button" onclick="customerLogin()">登入</button>
          <button class="btn btn-secondary" style="margin-top:10px;" type="button" onclick="setCustomerAuthMode('forgot')">忘記密碼</button>
        </div>

        <div id="customerRegister" class="hide">
          <div class="form-item">
            <label for="customerRegisterEmail">Email</label>
            <input type="email" id="customerRegisterEmail" autocomplete="email" placeholder="例如：name@example.com" spellcheck="false">
          </div>
          <div class="form-item">
            <label for="customerRegisterPassword">密碼</label>
            <input type="password" id="customerRegisterPassword" autocomplete="new-password" placeholder="請設定密碼" spellcheck="false">
          </div>
          <div class="form-item">
            <label for="customerRegisterCompanyName">公司名</label>
            <input type="text" id="customerRegisterCompanyName" autocomplete="organization" placeholder="請輸入公司名">
          </div>
          <div class="form-item">
            <label for="customerRegisterContactName">聯絡人</label>
            <input type="text" id="customerRegisterContactName" autocomplete="name" placeholder="請輸入聯絡人">
          </div>
          <div class="form-item">
            <label for="customerRegisterPhone">電話</label>
            <input type="tel" id="customerRegisterPhone" inputmode="tel" autocomplete="tel" placeholder="請輸入電話" spellcheck="false">
          </div>
          <div class="form-item">
            <label for="customerRegisterAddress">送貨地址</label>
            <input type="text" id="customerRegisterAddress" autocomplete="street-address" placeholder="請輸入送貨地址">
          </div>
          <button class="btn btn-success" type="button" onclick="customerRegister()">註冊並登入</button>
        </div>

        <div id="customerForgot" class="hide">
          <div class="form-item">
            <label for="customerForgotEmail">Email</label>
            <input type="email" id="customerForgotEmail" autocomplete="email" placeholder="請輸入註冊 Email" spellcheck="false">
          </div>
          <button class="btn btn-success" type="button" onclick="customerRequestPasswordReset()">發送重設密碼連結</button>
          <button class="btn btn-secondary" style="margin-top:10px;" type="button" onclick="setCustomerAuthMode('login')">返回登入</button>
        </div>
      </div>

      <div id="customerAuthLoggedIn" class="hide">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;">
          <div>
            <div style="font-weight:900;">已登入：<span id="customerEmail"></span></div>
            <div class="muted">下單/翻單需要登入；公司/聯絡人/電話/地址已自動填入（可修改但唔會回寫帳戶）。</div>
          </div>
          <button id="customerLogoutBtn" class="btn btn-sm btn-secondary" type="button" onclick="customerLogout()">登出</button>
        </div>
      </div>

      <div id="customerResetWrap" class="hide">
        <div style="font-weight:900;margin-bottom:10px;">重設密碼</div>
        <div class="form-item">
          <label for="customerResetNewPassword">新密碼</label>
          <input type="password" id="customerResetNewPassword" autocomplete="new-password" placeholder="請輸入新密碼" spellcheck="false">
        </div>
        <div class="form-item">
          <label for="customerResetConfirmPassword">確認新密碼</label>
          <input type="password" id="customerResetConfirmPassword" autocomplete="new-password" placeholder="請再輸入一次" spellcheck="false">
        </div>
        <button class="btn btn-success" type="button" onclick="customerResetPassword()">確認重設</button>
      </div>

      <div id="customerAuthMsg" class="muted" style="margin-top:10px;"></div>
    </div>

    <div class="tab-group">
      <button id="btn-new" class="tab-btn active" type="button" onclick="switchTab('new')">全新款式下單</button>
      <button id="btn-repeat" class="tab-btn" type="button" onclick="switchTab('repeat')">歷史訂單翻單</button>
      <button id="btn-query" class="tab-btn" type="button" onclick="switchTab('query')">訂單狀態查詢</button>
    </div>

    <div id="tab-new" class="tab-content">
      <div class="note-red">開板訂製（全新款）最低工期：31 工作日</div>
      <div class="note-green">現貨加工/熱昇華訂製、任何翻單：最低工期：17 工作日</div>

      <div class="form-item">
        <label for="cate1">訂製大分類</label>
        <select id="cate1" name="cate1" autocomplete="off" onchange="onCate1Changed()">
          <option value="">請選擇訂製類型</option>
        </select>
      </div>
      <div class="form-item">
        <label for="cate2">產品子分類</label>
        <select id="cate2" name="cate2" autocomplete="off" onchange="onCate2Changed()">
          <option value="">請選擇產品類型</option>
        </select>
      </div>

      <div id="jerseyWrap" class="form-item hide">
        <label for="cate3">球衣子類</label>
        <select id="cate3" name="cate3" autocomplete="off" onchange="onCate3Changed()">
          <option value="">請選擇</option>
          <option value="足球">足球</option>
          <option value="籃球">籃球</option>
          <option value="排球">排球</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div id="jerseyPartWrap" class="form-item hide">
        <label for="cate4">再子類</label>
        <select id="cate4" name="cate4" autocomplete="off" onchange="onCate4Changed()">
          <option value="">請選擇</option>
          <option value="上衣">上衣</option>
          <option value="褲子">褲子</option>
          <option value="整套">整套</option>
        </select>
      </div>

      <div class="form-item">
        <label>選擇款式</label>
        <div id="styleList"></div>
        <div id="styleHint" class="muted">請先選擇分類後載入款式。</div>
      </div>

      <div id="sizeWrap" class="hide">
        <div class="form-item">
          <label>尺碼表參考</label>
          <div id="sizeTablePreview" class="size-table-preview"></div>
        </div>

        <div class="form-item">
          <label>填寫各尺碼數量</label>
          <div id="qtyWrap" class="size-qty-row"></div>
        </div>

        <div class="form-item">
          <label for="deliveryDate">要求交貨日期</label>
          <input type="date" id="deliveryDate" name="requestedDeliveryDate" autocomplete="off">
          <div id="minDateHint" class="muted"></div>
        </div>

        <div class="form-item">
          <label for="companyName">公司名</label>
          <input type="text" id="companyName" name="companyName" autocomplete="organization" placeholder="請輸入公司名">
        </div>
        <div class="form-item">
          <label for="contactName">聯絡人</label>
          <input type="text" id="contactName" name="contactName" autocomplete="name" placeholder="請輸入聯絡人">
        </div>
        <div class="form-item">
          <label for="phone">電話</label>
          <input type="tel" id="phone" name="phone" inputmode="tel" autocomplete="tel" placeholder="請輸入電話" spellcheck="false">
        </div>
        <div class="form-item">
          <label for="address">送貨地址</label>
          <input type="text" id="address" name="address" autocomplete="street-address" placeholder="請輸入送貨地址">
        </div>

        <button class="btn btn-success" type="button" onclick="submitOrder('new')">提交訂單</button>
        <div id="newMsg" class="muted"></div>
        <div id="newResult" class="result-box hide"></div>
      </div>
    </div>

    <div id="tab-repeat" class="tab-content hide">
      <div class="form-item">
        <label for="repeatCompanyName">公司名</label>
        <input type="text" id="repeatCompanyName" name="repeatCompanyName" autocomplete="organization" placeholder="請輸入之前落單公司名">
      </div>
      <div class="form-item">
        <label for="repeatPhone">電話</label>
        <input type="tel" id="repeatPhone" name="repeatPhone" inputmode="tel" autocomplete="tel" placeholder="請輸入之前落單電話" spellcheck="false">
      </div>
      <button class="btn btn-warning" type="button" onclick="searchMyOrder()">查找歷史訂單</button>
      <div id="repeatMsg" class="muted"></div>

      <div id="repeatList" class="result-box hide"></div>

      <div id="repeatSelected" class="result-box hide"></div>
      <div id="repeatAction" class="hide" style="margin-top:10px;">
        <button class="btn btn-success" type="button" onclick="submitOrder('repeat')">確認翻單並提交</button>
      </div>
    </div>

    <div id="tab-query" class="tab-content hide">
      <div class="form-item">
        <label for="queryOrderSn">訂單編號</label>
        <input type="text" id="queryOrderSn" name="queryOrderSn" autocomplete="off" placeholder="例如：ORD20260509123456-abcdef" spellcheck="false">
      </div>
      <div class="form-item">
        <label for="queryLookupCode">查單碼（推薦）</label>
        <input type="text" id="queryLookupCode" name="queryLookupCode" autocomplete="off" placeholder="請輸入提交成功後顯示嘅查單碼" spellcheck="false">
      </div>
      <div class="form-item">
        <label for="queryPhone">電話（兼容舊單）</label>
        <input type="tel" id="queryPhone" name="queryPhone" inputmode="tel" autocomplete="tel" placeholder="如冇查單碼，先輸入落單電話" spellcheck="false">
      </div>
      <button class="btn btn-secondary" type="button" onclick="queryOrder()">查詢訂單狀態</button>
      <div id="queryMsg" class="muted"></div>
      <div id="queryResult" class="result-box hide"></div>
    </div>
  </div>
  </main>

  <script>
    let holidays = new Set();
    let stylesCache = [];
    let selectedStyleIds = new Set();
    let selectedSizeTableId = '';
    let repeatSelectedOrder = null;
    let categoriesCache = { cate1: [], cate2ByCate1: {} };
    let customerProvided = { enabled: false, text: '', images: [] };
    let customerToken = '';
    let customerMe = null;
    let customerAuthMode = 'login';
    let customerResetToken = '';
    const customerTokenKey = 'customerToken';

    function escapeHtml(s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function switchTab(tab) {
      if ((tab === 'new' || tab === 'repeat') && !customerToken) {
        setCustomerAuthMsg('請先登入，先可以使用下單/翻單。');
        setCustomerAuthMode('login');
        tab = 'query';
      }
      document.getElementById('tab-new').classList.add('hide');
      document.getElementById('tab-repeat').classList.add('hide');
      document.getElementById('tab-query').classList.add('hide');
      document.getElementById('btn-new').classList.remove('active');
      document.getElementById('btn-repeat').classList.remove('active');
      document.getElementById('btn-query').classList.remove('active');

      document.getElementById(`tab-${tab}`).classList.remove('hide');
      document.getElementById(`btn-${tab}`).classList.add('active');
    }

    function goToOrder() {
      switchTab('new');
      const el = document.getElementById('cate1') || document.getElementById('tab-new');
      if (!el || typeof el.scrollIntoView !== 'function') return;
      el.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }

    function setCustomerAuthMsg(s) {
      const el = document.getElementById('customerAuthMsg');
      if (el) el.textContent = String(s || '');
    }

    function setCustomerAuthMode(mode) {
      customerAuthMode = String(mode || 'login');
      renderCustomerAuth();
    }

    function renderCustomerAuth() {
      const loggedOut = document.getElementById('customerAuthLoggedOut');
      const loggedIn = document.getElementById('customerAuthLoggedIn');
      const resetWrap = document.getElementById('customerResetWrap');

      const login = document.getElementById('customerLogin');
      const reg = document.getElementById('customerRegister');
      const forgot = document.getElementById('customerForgot');
      const loginTab = document.getElementById('customerLoginTab');
      const regTab = document.getElementById('customerRegisterTab');

      const isReset = customerAuthMode === 'reset';
      if (resetWrap) resetWrap.classList.toggle('hide', !isReset);

      const isLoggedIn = !!customerMe && !!customerToken;
      if (loggedIn) loggedIn.classList.toggle('hide', !isLoggedIn || isReset);
      if (loggedOut) loggedOut.classList.toggle('hide', isLoggedIn || isReset);

      if (login) login.classList.toggle('hide', customerAuthMode !== 'login');
      if (reg) reg.classList.toggle('hide', customerAuthMode !== 'register');
      if (forgot) forgot.classList.toggle('hide', customerAuthMode !== 'forgot');

      if (loginTab) loginTab.classList.toggle('active', customerAuthMode === 'login');
      if (regTab) regTab.classList.toggle('active', customerAuthMode === 'register');

      const emailEl = document.getElementById('customerEmail');
      if (emailEl) emailEl.textContent = customerMe && customerMe.email ? customerMe.email : '';
    }

    function setCustomerSession(token, customer) {
      customerToken = String(token || '');
      customerMe = customer && typeof customer === 'object' ? customer : null;
      if (customerToken) localStorage.setItem(customerTokenKey, customerToken);
      else localStorage.removeItem(customerTokenKey);
      prefillCustomerFields();
      renderCustomerAuth();
    }

    function clearCustomerSession() {
      customerToken = '';
      customerMe = null;
      localStorage.removeItem(customerTokenKey);
      renderCustomerAuth();
    }

    function authHeaders() {
      if (!customerToken) return {};
      return { Authorization: `Bearer ${customerToken}` };
    }

    function prefillCustomerFields() {
      if (!customerMe) return;
      const setIfEmpty = (id, value) => {
        const el = document.getElementById(id);
        if (!el) return;
        if (!String(el.value || '').trim()) el.value = String(value || '');
      };
      setIfEmpty('companyName', customerMe.companyName);
      setIfEmpty('contactName', customerMe.contactName);
      setIfEmpty('phone', customerMe.phone);
      setIfEmpty('address', customerMe.address);
      setIfEmpty('repeatCompanyName', customerMe.companyName);
      setIfEmpty('repeatPhone', customerMe.phone);
    }

    async function customerRegister() {
      setCustomerAuthMsg('');
      const email = document.getElementById('customerRegisterEmail').value.trim();
      const password = document.getElementById('customerRegisterPassword').value;
      const companyName = document.getElementById('customerRegisterCompanyName').value.trim();
      const contactName = document.getElementById('customerRegisterContactName').value.trim();
      const phone = document.getElementById('customerRegisterPhone').value.trim();
      const address = document.getElementById('customerRegisterAddress').value.trim();

      if (!email || !password || !companyName || !contactName || !phone || !address) {
        setCustomerAuthMsg('請填妥所有註冊資料。');
        return;
      }

      const res = await fetch('/api/customer?action=register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password, companyName, contactName, phone, address })
      });
      const data = await res.json().catch(() => null);
      if (!data || !data.ok || !data.token) {
        if (data && data.error === 'email_exists') setCustomerAuthMsg('呢個 Email 已經註冊過。');
        else if (data && data.error === 'company_phone_exists') setCustomerAuthMsg('呢個公司名 + 電話已經註冊過。');
        else setCustomerAuthMsg('註冊失敗。');
        return;
      }

      setCustomerSession(data.token, data.customer);
      setCustomerAuthMsg('');
      goToOrder();
    }

    async function customerLogin() {
      setCustomerAuthMsg('');
      const email = document.getElementById('customerLoginEmail').value.trim();
      const password = document.getElementById('customerLoginPassword').value;
      if (!email || !password) {
        setCustomerAuthMsg('請輸入 Email 同密碼。');
        return;
      }

      const res = await fetch('/api/customer?action=login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json().catch(() => null);
      if (!data || !data.ok || !data.token) {
        setCustomerAuthMsg('Email 或密碼唔正確。');
        return;
      }

      setCustomerSession(data.token, data.customer);
      setCustomerAuthMsg('');
      goToOrder();
    }

    async function customerLogout() {
      setCustomerAuthMsg('');
      const token = customerToken;
      clearCustomerSession();
      switchTab('query');
      if (!token) return;

      await fetch('/api/customer?action=logout', {
        method: 'POST',
        headers: { Authorization: `Bearer ${token}` }
      }).catch(() => null);
    }

    async function customerRequestPasswordReset() {
      setCustomerAuthMsg('');
      const email = document.getElementById('customerForgotEmail').value.trim();
      if (!email) {
        setCustomerAuthMsg('請輸入 Email。');
        return;
      }

      const res = await fetch('/api/customer?action=requestPasswordReset', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await res.json().catch(() => null);
      if (!data || !data.ok) {
        if (data && data.error === 'base_url_not_configured') setCustomerAuthMsg('系統未設定重設密碼連結網址（PUBLIC_BASE_URL）。');
        else setCustomerAuthMsg('發送失敗，請稍後再試。');
        return;
      }

      setCustomerAuthMsg('如果 Email 存在，重設密碼連結已經發送。');
      setCustomerAuthMode('login');
    }

    async function customerResetPassword() {
      setCustomerAuthMsg('');
      const p1 = document.getElementById('customerResetNewPassword').value;
      const p2 = document.getElementById('customerResetConfirmPassword').value;
      if (!customerResetToken) {
        setCustomerAuthMsg('重設 token 不存在。');
        return;
      }
      if (!p1 || p1.length < 6) {
        setCustomerAuthMsg('請輸入新密碼（最少 6 個字）。');
        return;
      }
      if (p1 !== p2) {
        setCustomerAuthMsg('兩次輸入密碼唔一致。');
        return;
      }

      const res = await fetch('/api/customer?action=resetPassword', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token: customerResetToken, newPassword: p1 })
      });
      const data = await res.json().catch(() => null);
      if (!data || !data.ok) {
        if (data && data.error === 'token_expired') setCustomerAuthMsg('重設連結已過期，請重新申請。');
        else if (data && data.error === 'token_used') setCustomerAuthMsg('重設連結已經用過，請重新申請。');
        else setCustomerAuthMsg('重設失敗，請重新申請重設密碼。');
        return;
      }

      customerResetToken = '';
      const url = new URL(window.location.href);
      url.searchParams.delete('mode');
      url.searchParams.delete('token');
      history.replaceState({}, '', url.toString());
      setCustomerAuthMsg('重設成功，請用新密碼登入。');
      setCustomerAuthMode('login');
    }

    function pad(n) { return String(n).padStart(2, '0'); }
    function addDaysYmd(ymd, days) {
      const d = new Date(`${ymd}T00:00:00.000Z`);
      d.setUTCDate(d.getUTCDate() + days);
      return d.toISOString().slice(0, 10);
    }
    function isWeekend(ymd) {
      const d = new Date(`${ymd}T00:00:00.000Z`);
      const day = d.getUTCDay();
      return day === 0 || day === 6;
    }
    function addBusinessDays(startYmd, businessDays) {
      let cursor = String(startYmd);
      let left = Number(businessDays);
      while (left > 0) {
        cursor = addDaysYmd(cursor, 1);
        if (isWeekend(cursor)) continue;
        if (holidays.has(cursor)) continue;
        left -= 1;
      }
      return cursor;
    }
    function hkTodayYmd() {
      return new Date().toLocaleDateString('en-CA', { timeZone: 'Asia/Hong_Kong' });
    }
    function leadDays(mode) {
      if (mode === 'repeat') return 17;
      const c1 = document.getElementById('cate1').value;
      return c1 === '開板訂製' ? 31 : 17;
    }
    function updateMinDelivery(mode) {
      const lead = leadDays(mode);
      const earliest = addBusinessDays(hkTodayYmd(), lead);
      const el = document.getElementById('deliveryDate');
      el.min = earliest;
      if (!el.value || el.value < earliest) el.value = earliest;
      document.getElementById('minDateHint').textContent = `最快交貨日：${earliest}（今天16:00前確認訂單細節後計算出的最快交貨日）`;
    }

      if (v && (values || []).includes(v)) selectEl.value = v;
      else selectEl.value = '';
    }

    function renderStyles(styles) {

        div.className = 'style-item';
        const imgSrc = s.imgUrl || s.imgBase64 || 'data:image/gif;base64,R0lGODlhAQABAAAAACw=';
        const img = `<img width="80" height="80" loading="lazy" decoding="async" src="${imgSrc}" alt="${escapeHtml(s.name)}">`;
        div.innerHTML = `

    function renderCustomerProvidedBlock(style) {
      const wrap = document.getElementById('styleList');
      const div = document.createElement('div');
      div.className = 'style-item';
      div.innerHTML = `
        <div class="style-info" style="width:100%;">
          <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;">
            <div style="font-weight:bold;">${escapeHtml(style.name)}</div>
            <label style="display:flex;gap:8px;align-items:center;">
              <input type="checkbox" id="customerProvidedChk">
              選擇
            </label>
          </div>
          <div class="muted">客戶自行提供款式參考圖及描述</div>
          <div id="customerProvidedForm" class="hide" style="margin-top:10px;">
            <div class="form-item" style="margin:0 0 10px 0;">
              <label>描述</label>
              <textarea id="customerProvidedText" rows="3" placeholder="例如：自備球衣款式／想做成類似某款..." style="width:100%;padding:10px;border:1px solid #e5e7eb;border-radius:10px;"></textarea>
            </div>
            <div class="form-item" style="margin:0;">
              <label>參考圖（最多 3 張）</label>
              <input id="customerProvidedImages" type="file" accept="image/*" multiple>
              <div id="customerProvidedPreview" class="muted" style="margin-top:6px;"></div>
            </div>
          </div>
        </div>
      `;
      wrap.appendChild(div);

      const chk = div.querySelector('#customerProvidedChk');
      chk.addEventListener('change', async () => {
        customerProvided.enabled = !!chk.checked;
        const form = div.querySelector('#customerProvidedForm');
        if (chk.checked) {
          selectedStyleIds.add(style.id);
          form.classList.remove('hide');
        } else {
          selectedStyleIds.delete(style.id);
          form.classList.add('hide');
          customerProvided.text = '';
          customerProvided.images = [];
          div.querySelector('#customerProvidedText').value = '';
          div.querySelector('#customerProvidedImages').value = '';
          div.querySelector('#customerProvidedPreview').textContent = '';
        }
        await onStyleSelectionChanged();
      });

      div.querySelector('#customerProvidedText').addEventListener('input', (e) => {
        customerProvided.text = String(e.target.value || '').trim();
      });

      div.querySelector('#customerProvidedImages').addEventListener('change', async (e) => {
        const files = Array.from(e.target.files || []).slice(0, 3);
        const urls = [];
        for (const f of files) {
          if (!f || !f.type || !/^image\//.test(f.type)) continue;
          if (f.size > 500 * 1024) continue;
          const b64 = await new Promise((resolve) => {
            const r = new FileReader();
            r.onload = () => resolve(String(r.result || ''));
            r.onerror = () => resolve('');
            r.readAsDataURL(f);
          });
          if (b64) urls.push(b64);
        }
        customerProvided.images = urls;
        div.querySelector('#customerProvidedPreview').textContent = urls.length ? `已選擇 ${urls.length} 張` : '';
      });
    }

    function getCustomerProvidedStyle() {
      return stylesCache.find((s) => s && s.code === 'CUSTOMER_PROVIDED') || null;
    }

    async function onStyleSelectionChanged() {
      if (!selectedStyleIds.size) {
        document.getElementById('sizeWrap').classList.add('hide');
        selectedSizeTableId = '';
        return;
      }

      const firstId = Array.from(selectedStyleIds)[0];
      const style = stylesCache.find((x) => x.id === firstId);
      if (!style) return;
      const customer = getCustomerProvidedStyle();
      if (customer && selectedStyleIds.size === 1 && String(customer.id) === String(firstId)) {
        selectedSizeTableId = customer.sizeTableId;
        await loadSizeTable(selectedSizeTableId);
        document.getElementById('sizeWrap').classList.remove('hide');
        updateMinDelivery('new');
        return;
      }
      if (selectedSizeTableId !== style.sizeTableId) {
        selectedSizeTableId = style.sizeTableId;
        await loadSizeTable(selectedSizeTableId);
      }
      document.getElementById('sizeWrap').classList.remove('hide');
      updateMinDelivery('new');
    }

    async function loadSizeTable(id) {
      const res = await fetch(`/api/public/size-tables/${encodeURIComponent(id)}`);
      const data = await res.json().catch(() => null);
      if (!data || !data.ok) {
        document.getElementById('sizeTablePreview').innerHTML = '載入尺碼表失敗';
        return;
      }
      const st = data.sizeTable;
      const rows = Array.isArray(st.data) ? st.data : [];
      const hasLength = rows.some((r) => r && r.length != null && String(r.length).trim() !== '');
      const hasChest = rows.some((r) => r && r.chest != null && String(r.chest).trim() !== '');
      const hasWaist = rows.some((r) => r && r.waist != null && String(r.waist).trim() !== '');
      const hasSeat = rows.some((r) => r && r.seat != null && String(r.seat).trim() !== '');
      const hasChina = rows.some((r) => r && r.china != null && String(r.china).trim() !== '');
      const hasHeight = rows.some((r) => r && r.height != null && String(r.height).trim() !== '');

      const cols = [
        { key: 'eu', label: 'EU' },
        ...(hasLength ? [{ key: 'length', label: '衣長' }] : []),
        ...(hasChest ? [{ key: 'chest', label: '胸圍' }] : []),
        ...(hasWaist ? [{ key: 'waist', label: '腰圍' }] : []),
        ...(hasSeat ? [{ key: 'seat', label: '臀圍' }] : []),
        ...(hasChina ? [{ key: 'china', label: '中國碼' }] : []),
        ...(hasHeight ? [{ key: 'height', label: '身高' }] : [])
      ];

      const html = `
        <table>
          <thead><tr>${cols.map((c) => `<th>${c.label}</th>`).join('')}</tr></thead>
          <tbody>
            ${rows.map((r) => `<tr>${cols.map((c) => `<td>${(r && r[c.key]) != null ? escapeHtml(String(r[c.key])) : ''}</td>`).join('')}</tr>`).join('')}
          </tbody>
        </table>
      `;
      document.getElementById('sizeTablePreview').innerHTML = html;

      const sizes = rows.map((r) => (r && r.eu != null ? String(r.eu).trim() : '')).filter(Boolean);
      renderQtyInputs(sizes, null);
    }

    function renderQtyInputs(sizes, preset) {
      const wrap = document.getElementById('qtyWrap');
      const list = Array.isArray(sizes) ? sizes.map(String).map((s) => s.trim()).filter(Boolean) : [];
      const seen = new Set();
      const uniq = list.filter((s) => {
        if (seen.has(s)) return false;
        seen.add(s);
        return true;
      });

      const presetMap = new Map();
      if (Array.isArray(preset)) {
        preset.forEach((x) => {
          const size = x && x.size != null ? String(x.size).trim() : '';
          const qty = Number(x && x.qty);
          if (size) presetMap.set(size, Number.isFinite(qty) ? qty : 0);
        });
      }

      wrap.innerHTML = uniq
        .map(
          (s) => `
          <div>
            <label>${s}</label>
            <input type="number" data-size="${s}" value="${presetMap.has(s) ? presetMap.get(s) : 0}" min="0">
          </div>
        `
        )
        .join('');
    }

    function readQty() {
      const inputs = Array.from(document.querySelectorAll('#qtyWrap input[data-size]'));
      const out = inputs.map((el) => {
        const size = String(el.getAttribute('data-size') || '').trim();
        const n = Number(el.value || 0);
        return { size, qty: Number.isFinite(n) ? n : 0 };
      });
      return out;
    }

    async function copyText(s) {
      const text = String(s || '');
      if (!text) return false;
      try {
        await navigator.clipboard.writeText(text);
        return true;
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.left = '-9999px';
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        try {
          document.execCommand('copy');
          document.body.removeChild(ta);
          return true;
        } catch (e2) {
          document.body.removeChild(ta);
          return false;
        }
      }
    }

    async function submitOrder(mode) {
      const msgId = mode === 'repeat' ? 'repeatMsg' : 'newMsg';
      const msgEl = document.getElementById(msgId);
      msgEl.textContent = '';

      if (!customerToken) {
        msgEl.textContent = '請先登入先可以提交訂單';
        setCustomerAuthMode('login');
        switchTab('query');
        return;
      }

      let cate1 = document.getElementById('cate1').value;
      let cate2 = document.getElementById('cate2').value;

      if (mode === 'repeat') {
        if (!repeatSelectedOrder) {
          msgEl.textContent = '請先選擇一張歷史訂單';
          return;
        }
        cate1 = repeatSelectedOrder.cate1;
        cate2 = repeatSelectedOrder.cate2;
      }

      if (!cate1 || !cate2) {
        msgEl.textContent = '請先選擇分類';
        return;
      }

      if (!selectedStyleIds.size && mode !== 'repeat') {
        msgEl.textContent = '請選擇至少一個款式';
        return;
      }

      const qty = readQty();
      const qtyTotal = qty.reduce((a, b) => a + Number(b && b.qty ? b.qty : 0), 0);
      if (qtyTotal <= 0) {
        msgEl.textContent = '請填寫尺碼數量';
        return;
      }

      const companyName = (mode === 'repeat' ? document.getElementById('repeatCompanyName').value : document.getElementById('companyName').value).trim();
      const phone = (mode === 'repeat' ? document.getElementById('repeatPhone').value : document.getElementById('phone').value).trim();
      const contactName = document.getElementById('contactName').value.trim();
      const address = document.getElementById('address').value.trim();
      const requestedDeliveryDate = document.getElementById('deliveryDate').value;

      if (!companyName || !phone) {
        msgEl.textContent = '請填公司名及電話';
        return;
      }
      if (!address) {
        msgEl.textContent = '請填送貨地址';
        return;
      }

      updateMinDelivery(mode);
      if (requestedDeliveryDate < document.getElementById('deliveryDate').min) {
        msgEl.textContent = '交貨日過早，請重新選擇';
        return;
      }

      const styleIds = mode === 'repeat' ? new Set(repeatSelectedOrder.items.map((it) => String(it.styleId))) : selectedStyleIds;
      const items = Array.from(styleIds).map((styleId) => ({ styleId, qty }));
      if (mode !== 'repeat' && customerProvided.enabled) {
        const customerStyle = getCustomerProvidedStyle();
        const idx = items.findIndex((x) => customerStyle && String(x.styleId) === String(customerStyle.id));
        const payload = { customText: customerProvided.text, customImages: customerProvided.images };
        if (idx >= 0) items[idx] = { ...items[idx], ...payload };
        else if (customerStyle) items.push({ styleId: customerStyle.id, qty, ...payload });
      }

      const payload = {
        mode,
        cate1,
        cate2,
        cate3: cate2 === '球衣' ? document.getElementById('cate3').value : '',
        cate4: cate2 === '球衣' ? document.getElementById('cate4').value : '',
        companyName,
        contactName,
        phone,
        address,
        requestedDeliveryDate,
        sourceOrderId: mode === 'repeat' ? repeatSelectedOrder.id : null,
        items
      };

      const res = await fetch('/api/public/orders', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', ...authHeaders() },
        body: JSON.stringify(payload)
      });
      const data = await res.json().catch(() => null);
      if (!data || !data.ok) {
        if (data && data.error === 'delivery_date_too_early' && data.suggestedDeliveryDate) {
          msgEl.textContent = `交貨日過早，最快：${data.suggestedDeliveryDate}`;
        } else {
          msgEl.textContent = '提交失敗';
        }
        return;
      }

      const boxId = mode === 'repeat' ? 'repeatSelected' : 'newResult';
      const box = document.getElementById(boxId);
      box.classList.remove('hide');
      box.innerHTML = `<div style="font-weight:bold;">提交成功</div>
        <div>訂單編號：<b>${escapeHtml(data.orderSn)}</b></div>
        <div>查單碼：<b>${escapeHtml(data.lookupCode || '')}</b></div>
        <div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap;">
          <button class="btn btn-sm" type="button" onclick="copyLookupCode('${escapeHtml(data.orderSn)}','${escapeHtml(data.lookupCode || '')}')">複製查單碼</button>
          <button class="btn btn-sm" type="button" onclick="copyLookupLink('${escapeHtml(data.orderSn)}','${escapeHtml(data.lookupCode || '')}')">複製查單連結</button>
        </div>
        <div>狀態：${escapeHtml(data.status)}</div>
        <div>建議交貨日：${escapeHtml(data.suggestedDeliveryDate)}</div>`;

      if (mode !== 'repeat') {
        msgEl.textContent = '';
      } else {
        document.getElementById('repeatAction').classList.add('hide');
      }
    }

    async function searchMyOrder() {
      const msg = document.getElementById('repeatMsg');
      msg.textContent = '';
      repeatSelectedOrder = null;
      document.getElementById('repeatSelected').classList.add('hide');
      document.getElementById('repeatAction').classList.add('hide');

      if (!customerToken) {
        msg.textContent = '請先登入先可以查找歷史訂單';
        setCustomerAuthMode('login');
        switchTab('query');
        return;
      }

      const qs = new URLSearchParams();
      const companyName = document.getElementById('repeatCompanyName').value.trim();
      const phone = document.getElementById('repeatPhone').value.trim();
      if (companyName) qs.set('companyName', companyName);
      if (phone) qs.set('phone', phone);
      const res = await fetch(`/api/public/orders/history${qs.toString() ? `?${qs.toString()}` : ''}`, {
        headers: { ...authHeaders() }
      });
      const data = await res.json().catch(() => null);
      if (!data || !data.ok) {
        msg.textContent = '查找失敗';
        return;
      }

      const orders = data.orders || [];
      const listBox = document.getElementById('repeatList');
      listBox.classList.remove('hide');
      if (!orders.length) {
        listBox.textContent = '沒有找到歷史訂單';
        return;
      }

      listBox.innerHTML = orders.map((o) => {
        const styles = (o.items || []).map((it) => it.styleName || it.styleCode || '').filter(Boolean).join('、');
        return `<div style="padding:10px;border:1px solid #e5e7eb;border-radius:10px;margin-bottom:10px;">
          <div><b>${escapeHtml(o.orderSn)}</b> <span class="muted">(${new Date(o.createdAt).toLocaleString('zh-HK')})</span></div>
          <div class="muted">${escapeHtml(o.orderType)} / ${escapeHtml(o.status)}</div>
          <div class="muted">款式：${escapeHtml(styles || '—')}</div>
          <button class="btn btn-sm" type="button" onclick="selectHistoryOrder('${escapeHtml(o.id)}')">選擇此訂單翻單</button>
        </div>`;
      }).join('');

      window.__historyOrders = orders;
      updateMinDelivery('repeat');
    }

    function selectHistoryOrder(id) {
      const orders = window.__historyOrders || [];
      const o = orders.find((x) => x.id === id);
      if (!o) return;
      repeatSelectedOrder = o;

      const cate1El = document.getElementById('cate1');
      const cate2El = document.getElementById('cate2');
      const cate3El = document.getElementById('cate3');
      const cate4El = document.getElementById('cate4');

      cate1El.value = o.cate1 || '';
      onCate1Changed();
      cate2El.value = o.cate2 || '';
      onCate2Changed();
      if (String(o.cate2 || '') === '球衣') {
        cate3El.value = o.cate3 || '';
        cate4El.value = o.cate4 || '';
        onCate3Changed();
        onCate4Changed();
      }

      const items = Array.isArray(o.items) ? o.items : [];
      const firstQty = items[0] && items[0].qty ? items[0].qty : null;
      if (Array.isArray(firstQty) && firstQty.length) {
        const sizes = firstQty.map((x) => String(x && x.size ? x.size : '')).filter(Boolean);
        renderQtyInputs(sizes, firstQty);
      }

      document.getElementById('repeatSelected').classList.remove('hide');
      document.getElementById('repeatSelected').innerHTML = `<div style="font-weight:bold;">已選擇翻單</div>
        <div>原訂單：<b>${escapeHtml(o.orderSn)}</b></div>
        <div class="muted">${escapeHtml(o.orderType)} / ${escapeHtml(o.status)}</div>`;

      document.getElementById('repeatAction').classList.remove('hide');
      updateMinDelivery('repeat');
      document.getElementById('deliveryDate').value = document.getElementById('deliveryDate').min;
      switchTab('repeat');
    }

    async function queryOrder() {
      const orderSn = document.getElementById('queryOrderSn').value.trim();
      const lookupCode = document.getElementById('queryLookupCode').value.trim();
      const phone = document.getElementById('queryPhone').value.trim();
      const msg = document.getElementById('queryMsg');
      const box = document.getElementById('queryResult');
      msg.textContent = '';
      box.classList.add('hide');
      box.innerHTML = '';

      if (!orderSn || (!lookupCode && !phone)) {
        msg.textContent = '請輸入訂單編號 + 查單碼（或電話）';
        return;
      }

      const qs = new URLSearchParams();
      qs.set('orderSn', orderSn);
      if (lookupCode) qs.set('lookupCode', lookupCode);
      else qs.set('phone', phone);

      const res = await fetch(`/api/public/orders/status?${qs.toString()}`);
      const data = await res.json().catch(() => null);
      if (!data || !data.ok) {
        msg.textContent = '找不到訂單或資料不匹配';
        return;
      }

          const o = data.order;
      box.classList.remove('hide');
          const items = Array.isArray(o.items) ? o.items : [];
          const extra = items
            .filter((it) => (it.customText && String(it.customText).trim()) || (Array.isArray(it.customAttachments) && it.customAttachments.length))
            .map((it) => {
              const text = it.customText ? `<div class="muted">${escapeHtml(it.customText)}</div>` : '';
              const att = Array.isArray(it.customAttachments) ? it.customAttachments : [];
              const imgs = att.length
                ? `<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px;">${att
                    .map((a) => `<a class="muted" style="text-decoration:underline;" href="${escapeHtml(a.url)}" target="_blank" rel="noreferrer">參考圖</a>`)
                    .join('')}</div>`
                : '';
              return `<div style="margin-top:8px;">
                <div style="font-weight:bold;">${escapeHtml(it.styleName || it.styleCode || '客戶提供')}</div>
                ${text}
                ${imgs}
              </div>`;
            })
            .join('');
      box.innerHTML = `<div style="font-weight:bold;">訂單狀態</div>
        <div>訂單編號：<b>${escapeHtml(o.orderSn)}</b></div>
        <div>公司：${escapeHtml(o.companyName)}</div>
        <div>狀態：<b>${escapeHtml(o.status)}</b></div>
        <div>建議交貨日：${escapeHtml(o.suggestedDeliveryDate || '—')}</div>
        <div>客戶交貨日：${escapeHtml(o.requestedDeliveryDate || '—')}</div>
            <div class="muted">分類：${escapeHtml(o.cate1)} / ${escapeHtml(o.cate2)}${o.cate2 === '球衣' && o.cate3 && o.cate4 ? ` / ${escapeHtml(o.cate3)} / ${escapeHtml(o.cate4)}` : ''}</div>
            ${extra ? `<div style="margin-top:10px;">${extra}</div>` : ''}`;
    }

    async function init() {
      customerToken = localStorage.getItem(customerTokenKey) || '';
      const u = new URL(window.location.href);
      const mode = (u.searchParams.get('mode') || '').trim();
      const token = (u.searchParams.get('token') || '').trim();
      if ((mode === 'reset' || u.search.includes('mode=reset')) && token) {
        customerResetToken = token;
        customerAuthMode = 'reset';
      }

      const r = await fetch('/data/hk-holidays/2026.json').catch(() => null);
      const list = r ? await r.json().catch(() => []) : [];
      holidays = new Set(Array.isArray(list) ? list.map(String) : []);
      await loadCategories().catch(() => null);

      if (customerAuthMode !== 'reset' && customerToken) {
        const res = await fetch('/api/customer?action=me', { headers: { ...authHeaders() } }).catch(() => null);
        const data = res ? await res.json().catch(() => null) : null;
        if (data && data.ok && data.customer) {
          customerMe = data.customer;
          prefillCustomerFields();
          goToOrder();
        } else {
          clearCustomerSession();
        }
      }

      renderCustomerAuth();
      if (!customerToken) switchTab('query');
    }

    init();
  </script>
  </div>
</body>
</html>
